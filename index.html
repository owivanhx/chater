<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAYOL - My Journals</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <span class="icon">🦝</span>
      <h1>DAYOL</h1>
    </div>
  </header>

  <main class="journals-container" id="journalsGrid">
    </main>

  <button class="fab-btn" id="addBtn" aria-label="Adicionar Caderno">+</button>

  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">📖</span>
      <span>Diary</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⭐</span>
      <span>Favorites</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">🛍️</span>
      <span>Store</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>Setting</span>
    </button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
